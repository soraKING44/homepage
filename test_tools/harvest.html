<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字当てゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            touch-action: manipulation; /* ダブルタップによるズームを無効化 */
        }
        .btn-number.selected {
            background-color: #3b82f6; /* bg-blue-600 */
            color: white;
            border-color: #3b82f6; /* border-blue-600 */
        }
        .btn-action {
            transition: transform 0.1s ease;
        }
        .btn-action:active {
            transform: scale(0.95);
        }
        #message-box {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8 text-center">
        
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">数字当てゲーム</h1>
        <p class="text-gray-600 mb-6">隠された2つの数字を当ててください！</p>

        <!-- メッセージ表示エリア -->
        <div id="message-box" class="min-h-[80px] flex items-center justify-center bg-gray-100 rounded-lg p-4 mb-6">
            <p id="message" class="text-lg font-semibold text-gray-700">0から5の数字を選んで「チェック」を押してください。</p>
        </div>

        <!-- プレイヤーが選択した数字 -->
        <div class="mb-6 min-h-[40px]">
            <p class="text-sm text-gray-500 mb-2">あなたの選択:</p>
            <div id="selected-numbers-display" class="text-2xl font-bold text-blue-600 tracking-widest">&nbsp;</div>
        </div>

        <!-- 数字ボタン -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <button id="btn-0" class="btn-number text-2xl font-bold p-4 rounded-lg border-2 border-gray-300 bg-white text-gray-700 transition-colors duration-200">0</button>
            <button id="btn-1" class="btn-number text-2xl font-bold p-4 rounded-lg border-2 border-gray-300 bg-white text-gray-700 transition-colors duration-200">1</button>
            <button id="btn-2" class="btn-number text-2xl font-bold p-4 rounded-lg border-2 border-gray-300 bg-white text-gray-700 transition-colors duration-200">2</button>
            <button id="btn-3" class="btn-number text-2xl font-bold p-4 rounded-lg border-2 border-gray-300 bg-white text-gray-700 transition-colors duration-200">3</button>
            <button id="btn-4" class="btn-number text-2xl font-bold p-4 rounded-lg border-2 border-gray-300 bg-white text-gray-700 transition-colors duration-200">4</button>
            <button id="btn-5" class="btn-number text-2xl font-bold p-4 rounded-lg border-2 border-gray-300 bg-white text-gray-700 transition-colors duration-200">5</button>
        </div>

        <!-- 操作ボタン -->
        <div class="flex flex-col sm:flex-row gap-4">
            <button id="check-btn" class="btn-action w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow-md">
                チェック
            </button>
            <button id="restart-btn" class="btn-action w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg shadow-md">
                リスタート
            </button>
        </div>

        <!-- 正解表示エリア -->
        <div id="answer-area" class="mt-6 text-gray-600 hidden">
            正解は: <span id="answer" class="font-bold text-xl"></span>
        </div>

    </div>

    <script>
        // --- DOM要素の取得 ---
        const messageEl = document.getElementById('message');
        const messageBoxEl = document.getElementById('message-box');
        const checkBtn = document.getElementById('check-btn');
        const restartBtn = document.getElementById('restart-btn');
        const numberButtons = document.querySelectorAll('.btn-number');
        const selectedNumbersDisplay = document.getElementById('selected-numbers-display');
        const answerArea = document.getElementById('answer-area');
        const answerEl = document.getElementById('answer');

        // --- ゲームの状態を管理する変数 ---
        let secretNumbers = [];
        let selectedNumbers = [];
        let isGameOver = false;

        // --- ゲームの初期化・リスタート処理 ---
        function initGame() {
            isGameOver = false;
            secretNumbers = [];
            selectedNumbers = [];

            // 0から5までの数字からランダムに2つ選ぶ
            const numbers = [0, 1, 2, 3, 4, 5];
            while (secretNumbers.length < 2) {
                const randomIndex = Math.floor(Math.random() * numbers.length);
                const chosenNumber = numbers.splice(randomIndex, 1)[0];
                secretNumbers.push(chosenNumber);
            }
            secretNumbers.sort((a, b) => a - b); // 比較しやすいようにソートしておく

            // UIのリセット
            messageEl.textContent = '0から5の数字を選んで「チェック」を押してください。';
            messageEl.className = 'text-lg font-semibold text-gray-700';
            messageBoxEl.className = 'min-h-[80px] flex items-center justify-center bg-gray-100 rounded-lg p-4 mb-6';
            
            numberButtons.forEach(btn => {
                btn.classList.remove('selected');
                btn.disabled = false;
            });
            
            checkBtn.disabled = false;
            answerArea.classList.add('hidden');
            updateSelectedNumbersDisplay();
            
            console.log('正解:', secretNumbers); // デバッグ用にコンソールに正解を表示
        }

        // --- 選択された数字の表示を更新 ---
        function updateSelectedNumbersDisplay() {
            if (selectedNumbers.length === 0) {
                selectedNumbersDisplay.innerHTML = '&nbsp;'; // 空の時は高さを維持
            } else {
                selectedNumbersDisplay.textContent = selectedNumbers.sort((a, b) => a - b).join(', ');
            }
        }

        // --- 数字ボタンがクリックされた時の処理 ---
        function handleNumberClick(event) {
            if (isGameOver) return;

            const num = parseInt(event.target.textContent, 10);
            const button = event.target;

            // 選択されているかチェック
            const index = selectedNumbers.indexOf(num);
            if (index > -1) {
                // 既に選択されていれば解除
                selectedNumbers.splice(index, 1);
                button.classList.remove('selected');
            } else {
                // 選択されていなければ追加
                selectedNumbers.push(num);
                button.classList.add('selected');
            }
            updateSelectedNumbersDisplay();
        }

        // --- 「チェック」ボタンがクリックされた時の処理 ---
        function handleCheck() {
            if (isGameOver || selectedNumbers.length === 0) {
                messageEl.textContent = 'まず数字を選んでください。';
                messageEl.className = 'text-lg font-semibold text-yellow-700';
                messageBoxEl.className = 'min-h-[80px] flex items-center justify-center bg-yellow-100 rounded-lg p-4 mb-6';
                return;
            }

            // プレイヤーの選択と正解を比較
            const sortedSelected = [...selectedNumbers].sort((a, b) => a - b);
            
            // 1. 正解判定
            if (sortedSelected.length === 2 && sortedSelected.toString() === secretNumbers.toString()) {
                isGameOver = true;
                messageEl.textContent = '🎉 正解！おめでとうございます！ 🎉';
                messageEl.className = 'text-xl font-bold text-green-700';
                messageBoxEl.className = 'min-h-[80px] flex items-center justify-center bg-green-100 rounded-lg p-4 mb-6';
                answerEl.textContent = secretNumbers.join(' と ');
                answerArea.classList.remove('hidden');
                checkBtn.disabled = true;
                numberButtons.forEach(btn => btn.disabled = true);
                return;
            }

            // 2. Yes/No判定 (両方の数字が含まれているか)
            // secretNumbersの全ての要素がselectedNumbersに含まれているかチェック
            const hasBothMatches = secretNumbers.every(num => selectedNumbers.includes(num));

            if (hasBothMatches) {
                messageEl.textContent = 'Yes! 選んだ数字の中に、隠された数字が両方とも含まれています！';
                messageEl.className = 'text-lg font-semibold text-blue-700';
                messageBoxEl.className = 'min-h-[80px] flex items-center justify-center bg-blue-100 rounded-lg p-4 mb-6';
            } else {
                messageEl.textContent = 'No... 隠された数字の両方は含まれていません。';
                messageEl.className = 'text-lg font-semibold text-red-700';
                messageBoxEl.className = 'min-h-[80px] flex items-center justify-center bg-red-100 rounded-lg p-4 mb-6';
            }
        }

        // --- イベントリスナーの設定 ---
        numberButtons.forEach(button => {
            button.addEventListener('click', handleNumberClick);
        });
        checkBtn.addEventListener('click', handleCheck);
        restartBtn.addEventListener('click', initGame);

        // --- ゲーム開始 ---
        window.onload = initGame;
    </script>
</body>
</html>
